name: Marketing checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @vowora/marketing exec playwright install --with-deps chromium
      # Full tests remain mandatory on each current PR head; only superseded runs are cancelled.
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: marketing-test-results
          path: |
            apps/marketing/test-results/
            apps/web/test-results/
          retention-days: 7
