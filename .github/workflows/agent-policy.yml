name: Agent policy
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: policy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
      - name: Verify agent branch, task ID, and frozen sources
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$BASE_REF" == "main" ]] || { echo "PR must target main"; exit 1; }
            # Dependabot updates are not task branches. Skip only the name rule
            # when the head ref is dependabot/* or the actor is dependabot[bot].
            # The frozen-source check below still runs for these pull requests.
            if [[ "$HEAD_REF" == dependabot/* || "$ACTOR" == 'dependabot[bot]' ]]; then
              echo "Dependabot pull request; branch-name rule skipped"
            elif [[ ! "$HEAD_REF" =~ ^(feat|fix|chore)/([0-9]{2}-[a-z]|agent-workflow)-[a-z0-9-]+$ ]]; then
              echo "Expected feat|fix|chore/<task-id>-<description> or chore/agent-workflow-<description>"
              exit 1
            fi
            # checkout@v7 fetches the pull request merge commit at depth 1, so a
            # depth-1 fetch of main has no merge base with HEAD. Putting that
            # diff in an if-condition swallows the git error (set -e does not
            # apply there) and the job passes without reading the diff.
            # Unshallow the advertised pull ref, fetch the base branch, and
            # fail closed on any git error.
            if ! shallow="$(git rev-parse --is-shallow-repository)"; then
              echo "git rev-parse failed; frozen-source check failed closed"
              exit 1
            fi
            if [[ "$shallow" == "true" ]]; then
              if ! git fetch --no-tags --unshallow origin "$GITHUB_REF"; then
                echo "git fetch --unshallow failed; frozen-source check failed closed"
                exit 1
              fi
            fi
            if ! git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
              echo "git fetch of ${BASE_REF} failed; frozen-source check failed closed"
              exit 1
            fi
            if ! merge_base="$(git merge-base "origin/${BASE_REF}" HEAD)"; then
              echo "No merge base between origin/${BASE_REF} and HEAD; frozen-source check failed closed"
              exit 1
            fi
            if [[ -z "$merge_base" ]]; then
              echo "Empty merge base between origin/${BASE_REF} and HEAD; frozen-source check failed closed"
              exit 1
            fi
            # AGENTS.md lines 19-23 freeze three documents, not every file
            # under docs/product/. NUL records keep a rename of one of those
            # names from being hidden by C-quoting.
            diff_file="$(mktemp)"
            trap 'rm -f "$diff_file"' EXIT
            if ! git -c core.quotePath=false diff --name-status --find-renames -z "$merge_base" HEAD >"$diff_file"; then
              echo "git diff failed; frozen-source check failed closed"
              exit 1
            fi
            frozen_hit=0
            while IFS= read -r -d '' status || [[ -n "${status:-}" ]]; do
              [[ -z "${status:-}" ]] && continue
              path_a=""
              path_b=""
              if ! IFS= read -r -d '' path_a; then
                echo "git diff status record was truncated; frozen-source check failed closed"
                exit 1
              fi
              if [[ "$status" == R* || "$status" == C* ]]; then
                if ! IFS= read -r -d '' path_b; then
                  echo "git diff rename record was truncated; frozen-source check failed closed"
                  exit 1
                fi
              fi
              for path in "$path_a" "$path_b"; do
                case "$path" in
                  docs/product/Wedding-Platform-Product-Specification.md|\
                  docs/product/product-architecture.md|\
                  docs/product/UI-DESIGN-SYSTEM.md)
                    printf 'Frozen product source changed: %s\t%s\n' "$status" "$path"
                    frozen_hit=1
                    ;;
                esac
              done
            done <"$diff_file"
            if [[ "$frozen_hit" -ne 0 ]]; then
              echo "Frozen product sources changed; separate controlled approval required"
              exit 1
            fi
          fi
          echo "Agent policy checks passed"
