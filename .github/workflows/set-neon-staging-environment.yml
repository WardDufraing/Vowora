name: Set Neon Staging Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-staging:
    name: Configure Neon staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify database identity and ownership
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATIONS_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_MIGRATIONS_URL is missing"
            exit 1
          fi
          RESULT=$(psql "$DATABASE_URL" -X -t -A -v ON_ERROR_STOP=1 -c "
            SELECT current_database() = 'vowora'
              AND current_user = pg_get_userbyid(datdba)
            FROM pg_database WHERE datname = current_database();
          ")
          if [ "$RESULT" != "t" ]; then
            echo "::error::Expected vowora database connected as its owner"
            exit 1
          fi

      - name: Set staging database comment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATIONS_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 \
            -c "COMMENT ON DATABASE vowora IS 'vowora:staging';"

      - name: Verify staging marker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_MIGRATIONS_URL }}
        run: |
          set -euo pipefail
          RESULT=$(psql "$DATABASE_URL" -X -t -A -v ON_ERROR_STOP=1 \
            -c "SELECT shobj_description(oid, 'pg_database') FROM pg_database WHERE datname = current_database();")
          if [ "$RESULT" != "vowora:staging" ]; then
            echo "::error::Staging marker verification failed"
            exit 1
          fi
          echo "Neon staging database marker verified"
